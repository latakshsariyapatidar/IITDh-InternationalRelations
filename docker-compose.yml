version: '3.8'

services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    container_name: iro_postgres_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-iro_db}
    ports:
      # Bound to 127.0.0.1 to avoid exposing the database port publicly to the internet
      - "127.0.0.1:5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-iro_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - pgdata:/var/lib/postgresql/data
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    entrypoint: ["npm", "run", "db:deploy"]
    restart: "no"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}@db:5432/${POSTGRES_DB:-iro_db}?schema=public
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set in .env}
      - PORT=3000
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:?GOOGLE_CLIENT_ID must be set in .env}
    depends_on:
      db:
        condition: service_healthy

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    container_name: iro_backend
    stop_grace_period: 20s
    environment:
      - NODE_ENV=production
      - TZ=UTC
      - PORT=3000
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}@db:5432/${POSTGRES_DB:-iro_db}?schema=public
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set in .env}
      # Separate secret for signed passport-scan download links.
      # Falls back to JWT_SECRET in application code if unset, but must be
      # explicitly provided here so links cannot be forged with the auth token.
      - EXPORT_LINK_SECRET=${EXPORT_LINK_SECRET:?EXPORT_LINK_SECRET must be set in .env}
      # CORS_ORIGIN must match your exact public domain (no trailing slash).
      # Multiple origins: comma-separated, e.g. https://example.com,https://www.example.com
      - CORS_ORIGIN=${CORS_ORIGIN:?CORS_ORIGIN must be set in .env}
      - SEED_ADMIN_PASSWORD=${SEED_ADMIN_PASSWORD:?SEED_ADMIN_PASSWORD must be set in .env}
      # TRUST_PROXY=1 is correct ONLY when nginx is the single reverse-proxy in
      # front of this container. If a CDN or second load-balancer also sits
      # upstream, increase this number or provide a trusted IP/CIDR range to
      # prevent X-Forwarded-For spoofing that would collapse rate limits.
      - TRUST_PROXY=${TRUST_PROXY:-1}
      - PUBLIC_API_BASE_URL=${PUBLIC_API_BASE_URL:?PUBLIC_API_BASE_URL must be set in .env}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:?GOOGLE_CLIENT_ID must be set in .env}
      - COOKIE_SECURE=${COOKIE_SECURE:-true}
      - COOKIE_SAMESITE=${COOKIE_SAMESITE:-lax}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    volumes:
      - ./backend/uploads:/app/uploads
      # ⚠️  Passport scans (private-uploads) are stored unencrypted on the host
      #     filesystem. Enforce a deletion policy (e.g. purge after 90 days post-
      #     decision) and consider volume-level encryption (LUKS or cloud-provider
      #     managed disk encryption). See security review finding #15.
      - ./backend/private-uploads:/app/private-uploads
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    container_name: iro_frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pgdata:
    driver: local
